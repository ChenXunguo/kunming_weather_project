version: '3.8'

services:
  weather:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: weather-collector
    restart: always
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./models:/app/models
      - ./model_cache:/app/model_cache
      - ./run:/app/run
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=weather
      - DB_PASSWORD=weather123
      - DB_NAME=kunming_weather
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TZ=Asia/Shanghai
    depends_on:
      - mysql
    networks:
      - weather-net

  mysql:
    image: mysql:8.0
    container_name: weather-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kunming_weather
      MYSQL_USER: weather
      MYSQL_PASSWORD: weather123
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - weather-net

volumes:
  mysql-data:

networks:
  weather-net:
